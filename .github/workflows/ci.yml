name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from the `packageManager` field in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: pnpm install

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run test:coverage

      - run: pnpm run build

      # Checks that both the ESM and the CJS entry resolve to the right types.
      - run: pnpm run check:exports
